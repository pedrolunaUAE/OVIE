# Cliente OVIE (HTML/JS/jQuery) servido por nginx.
# Las peticiones a /ovie/ se reenvían al backend, así cliente y
# servicios comparten origen (http://localhost) y se evita CORS.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    add_header Permissions-Policy "unload=(self)" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # OpenStreetMap (política de tiles: User-Agent identificado, sin saturar desde el navegador)
    location /osm-tiles/ {
        proxy_pass         https://tile.openstreetmap.org/;
        proxy_set_header   Host              tile.openstreetmap.org;
        proxy_set_header   User-Agent        "OVIE-local-dev/1.0 (+https://www.inegi.org.mx; contacto desarrollo local)";
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
    }

    # WMS INEGI (mismo origen; evita Referer localhost y reparto entre hosts)
    location /inegi-mdmCache/ {
        proxy_pass         https://gaiamapas.inegi.org.mx/mdmCache/;
        proxy_set_header   Host              gaiamapas.inegi.org.mx;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    location /inegi-gaia/ {
        proxy_pass         https://gaia.inegi.org.mx/NLB/tunnel/wms/;
        proxy_set_header   Host              gaia.inegi.org.mx;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # API REST -> Spring Boot
    location /ovie/ {
        proxy_pass         http://ovie-services:8080/ovie/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Archivos estáticos del cliente (SPA solo si el archivo no existe)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JSON / manifest (antes del fallback SPA vía try_files $uri)
    location ~* \.(json|webmanifest)$ {
        default_type application/json;
        try_files $uri =404;
    }

    # Caché para librerías (jQuery, jQuery UI, etc.)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # No exponer metadatos del repositorio
    location ~ /\.(git|env) {
        deny all;
    }
}
