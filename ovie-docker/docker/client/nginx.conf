# Cliente OVIE (HTML/JS/jQuery) servido por nginx.
# Las peticiones a /ovie/ se reenvían al backend, así cliente y
# servicios comparten origen (http://localhost) y se evita CORS.

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API REST -> Spring Boot
    location /ovie/ {
        proxy_pass         http://ovie-services:8080/ovie/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Archivos estáticos del cliente
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché para librerías (jQuery, jQuery UI, etc.)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # No exponer metadatos del repositorio
    location ~ /\.(git|env) {
        deny all;
    }
}
