# ============================================================
# OVIE - Oficina Virtual de Información Económica
# Estructura esperada:
#   D:\ws\ovie\
#   ├── ovie-client\      (repositorio del cliente)
#   ├── ovie-services\    (repositorio del backend)
#   └── ovie-docker\      (esta carpeta)
#
# Uso:  cd /d D:\ws\ovie\ovie-docker
#       copy .env.example .env   (y editar valores)
#       docker compose up -d --build
# ============================================================

name: ovie

services:

  # ---------------- Base de datos ----------------
  postgres:
    # PostGIS porque OVIE es un SIG; si la base oficial no usa
    # extensiones espaciales, puede cambiarse a postgres:17
    image: postgis/postgis:17-3.5
    container_name: ovie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Mexico_City
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts .sql / .sql.gz / .sh que se ejecutan SOLO
      # la primera vez (cuando el volumen está vacío)
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------- Backend (Spring Boot) ----------------
  ovie-services:
    build:
      context: ../ovie-services
      dockerfile: ../ovie-docker/docker/backend/Dockerfile
      additional_contexts:
        certs: ./certs
    image: ovie-services:local
    container_name: ovie-services
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      JAVA_TOOL_OPTIONS: ${JAVA_OPTS:--Xms256m -Xmx1g}
      TZ: America/Mexico_City
    volumes:
      # Configuración externa: no hace falta modificar el repositorio
      - ./config/application-docker.yml:/app/config/application-docker.yml:ro
      - backend_logs:/app/logs
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------- Cliente web (estático + proxy) ----------------
  ovie-client:
    image: nginx:1.27-alpine
    container_name: ovie-client
    restart: unless-stopped
    volumes:
      - ../ovie-client:/usr/share/nginx/html:ro
      - ./docker/client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${CLIENT_PORT:-80}:80"
    depends_on:
      - ovie-services



volumes:
  postgres_data:
  backend_logs:
