    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      pool-name: ovieAnalisisPool
    url: #agregar conexión a base de datos ejemplo: jdbc:postgresql://esquema:puerto/base_de_datos
    driver-class-name: org.postgresql.Driver
    username: #agregar usuario a base de datos
    password: #agregar contraseña de base de datos

logging:
